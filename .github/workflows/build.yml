name: Build NanoLimboVelocity

on:
  push:
    branches: [main, support-26.3, fix-velocity-4.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build shaded Velocity plugin
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean :velocity:shadowJar
      - name: Verify plugin class is present
        run: |
          JAR="$(find velocity/build/libs -name '*-all.jar' -type f | head -n1)"
          test -n "$JAR"
          unzip -l "$JAR" | grep -q 'com/bivashy/limbo/NanoLimboVelocity.class'
          echo "Built $JAR"
      - uses: actions/upload-artifact@v4
        with:
          name: NanoLimboVelocity-26.3
          path: velocity/build/libs/*-all.jar
          if-no-files-found: error
